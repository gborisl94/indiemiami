<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Grim Dawn Archer</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#131326;touch-action:none;position:fixed;}
  #c{display:block;width:100vw;height:100vh;background:#131326;}
  #ui{position:absolute;top:0;left:0;width:100vw;height:100vh;pointer-events:none;font-family:monospace;font-weight:bold;font-size:11px;color:#fff;z-index:5;}
  #flash{position:absolute;top:0;left:0;width:100vw;height:100vh;background:#ff0022;opacity:0;pointer-events:none;transition:opacity 0.08s;z-index:10;}
  .joy{position:absolute;bottom:20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.25);pointer-events:auto;touch-action:none;z-index:20;}
  #joyL{left:20px;}
  #joyR{right:20px;}
  .stick{position:absolute;top:50%;left:50%;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.35);transform:translate(-50%,-50%);pointer-events:none;border:2px solid rgba(255,255,255,0.5);}
  .btn{position:absolute;width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.3);color:#fff;font-family:monospace;font-weight:bold;font-size:12px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;z-index:20;text-shadow:0 0 4px #000;}
  #b_fire{right:150px;bottom:90px;background:rgba(255,80,80,0.25);border-color:rgba(255,120,120,0.6);}
  #b_boom{right:20px;bottom:150px;}
  #b_craft{right:110px;bottom:20px;}
  #hud{position:absolute;top:0;left:0;width:100%;height:34px;background:#000;display:flex;align-items:center;padding:0 8px;gap:10px;z-index:15;}
  #hpbar{width:180px;height:12px;background:#222;border:1px solid #555;overflow:hidden;}
  #hpfill{width:100%;height:100%;background:#0d0;transition:width 0.1s, background 0.2s;}
  #hudtxt{font-size:11px;color:#ccc;white-space:nowrap;}
  #go{position:absolute;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:auto;z-index:30;}
  #go h1{font-size:42px;color:#ff007f;text-shadow:0 0 12px #ff007f;margin-bottom:8px;font-family:monospace;}
  #go p{font-size:18px;color:#fff;margin-bottom:20px;font-family:monospace;}
  #go button{padding:12px 28px;font-family:monospace;font-weight:bold;font-size:14px;background:#2a2a44;color:#fff;border:2px solid #666;border-radius:6px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="flash"></div>
  <div id="hud">
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="hudtxt">HP 100 | FISH 0 ARR 0 EXPL 0 SCORE 0</div>
  </div>
  <div class="joy" id="joyL"><div class="stick" id="stickL"></div></div>
  <div class="joy" id="joyR"><div class="stick" id="stickR"></div></div>
  <div class="btn" id="b_fire">FEU</div>
  <div class="btn" id="b_boom">BOOM</div>
  <div class="btn" id="b_craft">CRAFT</div>
  <div id="go"><h1>GAME OVER</h1><p id="gotxt">Score 0</p><button id="gobtn">RESTART</button></div>
</div>
<script src="game.js"></script>
</body>
</html>
