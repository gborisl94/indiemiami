name: Build Indie Miami APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with Cordova
        uses: peter-evans/cordova-build@v1
        with:
          www:./
          package: com.indiemimiami.game
          app_name: INDIE MIAMI
          android_package_type: apk
      - uses: actions/upload-artifact@v4
        with:
          name: INDIE-MIAMI-APK
          path: platforms/android/app/build/outputs/apk/debug/*.apk